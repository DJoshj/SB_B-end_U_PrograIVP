spring.application.name=springBackEndUniversidad
#=========================================
#* ruta para el versionado de la aplicación *
#=========================================
server.servlet.context-path=/api/v1

#==================================================
#**Configuración personalizada de la aplicación ***
#==================================================
app.name=Sistema de Inscripción de Materias
app.version=1.0.0
app.autor=Jose Ramos
app.language=es
app.country=SV
app.support.email=soporte@ulaes.edu.sv
app.base.url=https://ulaes.edu.sv

#=========================================
#********** BASE DE DATOS ************+***
#=========================================
spring.datasource.url=jdbc:mysql://localhost:3306/ulaesDB
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring,jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddlAuto=update

